# App + Postgres. All secrets come from web/.env (copy .env.example; never commit it).
# Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in front for anything beyond localhost.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hirelog
      POSTGRES_USER: hirelog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelog -d hirelog"]
      interval: 5s
      retries: 10
    # No published port: only the app container can reach the database.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      HIRELOG_DATABASE_URL: postgresql+asyncpg://hirelog:${POSTGRES_PASSWORD}@db:5432/hirelog
    volumes:
      - uploads:/data
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  pgdata:
  uploads:
